name: Restricted backup maintenance transport check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: backup-maintenance-transport-check
  cancel-in-progress: false
jobs:
  transport:
    if: github.repository == 'Bruce7771/neo-backup-operations' && github.ref == 'refs/heads/main'
    environment: NEO_BACKUP_MAINTENANCE
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify status access and rejection of a general command
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NEO_MAINTENANCE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NEO_MAINTENANCE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          work=$(mktemp -d "$RUNNER_TEMP/backup-transport.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$work/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$work/known_hosts"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          args=(-T -F /dev/null -o BatchMode=yes -o ConnectTimeout=10
                -o IdentitiesOnly=yes -o ClearAllForwardings=yes
                -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$work/known_hosts"
                -i "$work/key" root@2.24.129.173)
          ssh "${args[@]}" status > "$work/status.json" 2> "$work/status.error"
          denied=0
          ssh "${args[@]}" id > "$work/denied.out" 2> "$work/denied.error" || denied=$?
          case "$denied" in 1|2) ;; *) echo '::error::Expected explicit restricted-command denial'; exit 1 ;; esac
          python3 - "$work/status.json" "$work/denied.out" "$denied" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1]))
          denied=json.load(open(sys.argv[2]))
          assert int(sys.argv[3]) in (1,2)
          assert state.get('schema') == 2
          assert state.get('repository_id') == '4daea08c03744d89ff9954c22b337c38beea7a2cc7c517d50e7370776fc13a11'
          assert state.get('publication_producers_enrolled') is True
          assert state.get('source_review_integrity') is True
          assert state.get('publication_hold_maximum_seconds') == 120
          assert state.get('service_or_schedule_changes') is False
          assert state.get('environment_values_read') is False
          assert state.get('credential_values_returned') is False
          assert 'lease' not in state and 'owner_nonce' not in state
          assert denied == {'ok':False,'failure_type':'ValueError'}
          print(json.dumps({'restricted_status_access':True,'status_schema':2,
            'fixed_repository_identity_matched':True,'publication_producers_enrolled':True,
            'source_review_integrity':True,'general_command_rejected':True,
            'active_known_writer_count':len(state.get('active_known_writer_units',[])),
            'active_known_repository_clients':state.get('active_known_repository_clients'),
            'fence_acquired_by_this_check':False,'backup_or_application_mutation':False}))
          PY
      # This job never acquires a fence, reads databases, prunes B2 or uploads artifacts.
