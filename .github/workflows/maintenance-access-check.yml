name: Independent scoped maintenance access check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-repository-maintenance
  cancel-in-progress: false
jobs:
  readonly-access:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Bruce7771/neo-backup-operations' && github.ref == 'refs/heads/main'
    environment: NEO_BACKUP_MAINTENANCE
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Load exact reviewed operational commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test read-only boundaries with synthetic responses
        run: python3 scripts/maintenance-access-check-test.py
      - name: Install checksum-pinned restic
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --location --max-time 45 \
            https://github.com/restic/restic/releases/download/v0.16.4/restic_0.16.4_linux_amd64.bz2 \
            -o "$RUNNER_TEMP/restic.bz2"
          printf '%s  %s\n' 3d4d43c169a9e28ea76303b1e8b810f0dcede7478555fdaa8959971ad499e324 "$RUNNER_TEMP/restic.bz2" | sha256sum -c -
          install -d -m 0700 "$RUNNER_TEMP/restic-bin"
          bzip2 -dc "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic-bin/restic"
          chmod 0700 "$RUNNER_TEMP/restic-bin/restic"
          echo "$RUNNER_TEMP/restic-bin" >> "$GITHUB_PATH"
          rm -- "$RUNNER_TEMP/restic.bz2"
      - name: Verify only scoped authorization and read encrypted metadata
        env:
          NEO_B2_AUDIT_KEY_ID: ${{ secrets.NEO_B2_AUDIT_KEY_ID }}
          NEO_B2_AUDIT_KEY: ${{ secrets.NEO_B2_AUDIT_KEY }}
          NEO_B2_MAINTENANCE_KEY_ID: ${{ secrets.NEO_B2_MAINTENANCE_KEY_ID }}
          NEO_B2_MAINTENANCE_KEY: ${{ secrets.NEO_B2_MAINTENANCE_KEY }}
          NEO_RESTIC_REPOSITORY: ${{ secrets.NEO_RESTIC_REPOSITORY }}
          NEO_RESTIC_PASSWORD: ${{ secrets.NEO_RESTIC_PASSWORD }}
          NEO_B2_REGION: ${{ vars.NEO_B2_REGION }}
        run: python3 scripts/maintenance-access-check.py
      # No cron, fence/SSH, canary, backup, mutation, purge, artifact or cache.
